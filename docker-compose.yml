services:
  app:
    build: .
    container_name: aomstats-crawler
    ports:
      - "3000:3000"
    volumes:
      - ./db.sqlite:/usr/src/app/db.sqlite
      - ./replays:/usr/src/app/replays
      - ../aomstats-crawler-data/backups:/usr/src/app/backups
    env_file:
      - .env
    command: node app.js

  replay-server:
    build: ./replay-server
    container_name: aomstats-replay-server
    ports:
      - "8081:8080"
    volumes:
      - ./replays:/usr/src/app/replays:ro
